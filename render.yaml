services:
  - type: web
    name: trustlayer-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./trustlayer.db
      - key: FRONTEND_ORIGIN
        value: https://YOUR-FRONTEND-DOMAIN
